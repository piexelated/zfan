name: Bug report
description: Something in zfan or the driver doesn't work as described.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: zfan doctor
      description: Output of `zfan doctor`.
      render: shell
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Distribution and kernel
      placeholder: "Fedora 43, 6.17.4"
